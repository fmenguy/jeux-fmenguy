<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aelindra · Design Showcase</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* ===== Demo-only : .phone-frame (équivalent #phone, multi-instance) ===== */
    html, body { background: #f0eee9; height: 100%; overflow: hidden; }
    body { display: block; }

    .phone-frame {
      width: 360px;
      height: 640px;
      position: relative;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-title);
      background:
        radial-gradient(120% 60% at 50% 0%,
          color-mix(in oklab, var(--rune) 5%, transparent) 0%,
          transparent 55%),
        radial-gradient(80% 50% at 50% 100%,
          color-mix(in oklab, var(--gold) 4%, transparent) 0%,
          transparent 60%),
        var(--bg);
      border: 1px solid var(--b);
      border-radius: 3px;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
      isolation: isolate;
      -webkit-font-smoothing: antialiased;
    }
    .phone-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--noise);
      opacity: .35;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 100;
    }
    .phone-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.42) 100%);
      pointer-events: none;
      z-index: 101;
    }
    /* Le `.scr.on` à l'intérieur d'un .phone-frame doit s'absoluer dessus */
    .phone-frame .scr {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Scrollbars subtiles */
    .phone-frame *::-webkit-scrollbar { width: 3px; }
    .phone-frame *::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

    /* ===== Système & Composants — sections additionnelles ===== */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--b);
      border-radius: 3px;
      width: 100%;
      max-width: 720px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: 'Crimson Pro', serif;
      font-size: 11px;
      color: var(--text);
    }
    .swatch .chip {
      width: 100%;
      height: 64px;
      border-radius: 2px;
      border: 1px solid var(--b2);
    }
    .swatch .nm {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: .15em;
      color: var(--gold-dim);
    }
    .swatch .hex { color: var(--dim); font-style: italic; font-size: 10px; }

    .components-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      background: var(--bg);
      border: 1px solid var(--b);
      border-radius: 3px;
      width: 720px;
    }
    .components-row > .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .components-row .lbl-row {
      width: 100px;
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: .25em;
      color: var(--gold-dim);
    }

    .icons-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 12px;
      padding: 18px;
      background: var(--bg);
      border: 1px solid var(--b);
      border-radius: 3px;
      width: 720px;
    }
    .icon-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--gold);
    }
    .icon-cell .ico { width: 28px; height: 28px; }
    .icon-cell .nm {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      color: var(--dim);
      letter-spacing: .1em;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const Ico = window.Ico;

    // Helper : un téléphone qui rend une scène donnée, dans un thème optionnel
    function Phone({ theme, children }) {
      return (
        <div className="phone-frame" data-theme={theme}>
          {children}
        </div>
      );
    }

    function PaletteSwatches() {
      const tokens = [
        { nm: "bg",     v: "var(--bg)" },
        { nm: "p2",     v: "var(--p2)" },
        { nm: "b2",     v: "var(--b2)" },
        { nm: "gold",   v: "var(--gold)" },
        { nm: "rune",   v: "var(--rune)" },
        { nm: "text",   v: "var(--text)" },
        { nm: "common", v: "var(--r-common)" },
        { nm: "rare",   v: "var(--r-rare)" },
        { nm: "epic",   v: "var(--r-epic)" },
        { nm: "legend", v: "var(--r-legend)" },
        { nm: "hp",     v: "var(--hp)" },
        { nm: "mp",     v: "var(--mp)" },
      ];
      return (
        <div className="swatch-grid">
          {tokens.map(t => (
            <div className="swatch" key={t.nm}>
              <div className="chip" style={{ background: t.v }}></div>
              <span className="nm">{t.nm.toUpperCase()}</span>
            </div>
          ))}
        </div>
      );
    }

    function ComponentsShowcase() {
      return (
        <div className="components-row">
          <div className="row">
            <span className="lbl-row">BOUTONS</span>
            <button className="btn-gold">CONFIRMER</button>
            <button className="btn-outline">ANNULER</button>
            <button className="btn-outline is-rune">EXAMINER</button>
            <button className="btn-ghost">PASSER</button>
            <button className="bk"><Ico id="back" className="ico" /> RETOUR</button>
            <button className="btn-gold" disabled>DÉSACTIVÉ</button>
          </div>

          <div className="row">
            <span className="lbl-row">MONNAIES</span>
            <span className="curr curr--gold"><Ico id="coin" className="ico sym sym--gold" /><span className="val">320</span></span>
            <span className="curr curr--orb"><Ico id="orb" className="ico sym sym--orb" /><span className="val">64</span></span>
            <span className="curr"><Ico id="potion" className="ico" /><span className="val">3</span></span>
          </div>

          <div className="row">
            <span className="lbl-row">RARETÉS</span>
            <span className="rp rp-c">COMMUN</span>
            <span className="rp rp-r">RARE</span>
            <span className="rp rp-e">ÉPIQUE</span>
            <span className="rp rp-l">LÉGENDAIRE</span>
          </div>

          <div className="row">
            <span className="lbl-row">TAGS</span>
            <span className="tag tag-tuto">TUTORIEL</span>
            <span className="tag tag-floor">PORTÉE 4</span>
            <span className="tag tag-reward">+30 ORBES</span>
            <span className="tag tag-locked">VERROUILLÉ</span>
            <span className="tag tag-done">COMPLÉTÉ</span>
            <span className="badge-new">NOUVEAU</span>
          </div>

          <div className="row">
            <span className="lbl-row">BARRES</span>
            <div className="bar-wrap" style={{ flex: 1 }}>
              <span className="lbl" style={{ color: "var(--hp)" }}>PV</span>
              <div className="bar bar--hp"><div className="fill" style={{ width: "72%" }}></div></div>
              <span className="val t-body">108 / 150</span>
            </div>
          </div>
          <div className="row">
            <span className="lbl-row" style={{ opacity: 0 }}>—</span>
            <div className="bar-wrap" style={{ flex: 1 }}>
              <span className="lbl" style={{ color: "var(--mp)" }}>PM</span>
              <div className="bar bar--mp"><div className="fill" style={{ width: "44%" }}></div></div>
              <span className="val t-body">22 / 50</span>
            </div>
          </div>
          <div className="row">
            <span className="lbl-row" style={{ opacity: 0 }}>—</span>
            <div className="bar-wrap" style={{ flex: 1 }}>
              <span className="lbl" style={{ color: "var(--rune)" }}>XP</span>
              <div className="bar bar--rune"><div className="fill" style={{ width: "30%" }}></div></div>
              <span className="val t-body">320 / 1080</span>
            </div>
          </div>

          <div className="row" style={{ alignItems: "stretch", gap: 10 }}>
            <span className="lbl-row" style={{ alignSelf: "center" }}>SÉPARATEURS</span>
            <div style={{ flex: 1 }}>
              <div className="divider-rune"><span className="line"></span><span className="glyph">✦</span><span className="line"></span></div>
              <div className="divider-rune rune-cool"><span className="line"></span><span className="glyph">◆</span><span className="line"></span></div>
            </div>
          </div>
        </div>
      );
    }

    function IconsShowcase() {
      const ids = [
        "sigil", "dungeon", "guild", "market", "team", "missions", "warrior", "archer",
        "mage", "guardian", "spy", "healer", "monk", "bard", "ensnarer", "coin",
        "orb", "move", "attack", "spell", "head", "body", "weapon", "offhand",
        "back", "check", "gift", "lock", "info", "star", "potion", "rune", "time", "edit", "target", "end",
      ];
      return (
        <div className="icons-grid">
          {ids.map(id => (
            <div className="icon-cell" key={id}>
              <Ico id={id} className="ico" />
              <span className="nm">{id.toUpperCase()}</span>
            </div>
          ))}
        </div>
      );
    }

    function App() {
      return (
        <>
          {window.ICON_DEFS}
          <DesignCanvas>
            {/* ============================================
                SECTION 1 · ÉCRANS · DIRECTION PRINCIPALE
                ============================================ */}
            <DCSection id="screens-main"
              title="Écrans · Souterrain Mystique"
              subtitle="Direction principale — palette violette/cristal + or patiné. Tous les écrans à 360 × 640."
            >
              <DCArtboard id="splash" label="01 · Hub" width={360} height={640}>
                <Phone><ScrSplash /></Phone>
              </DCArtboard>

              <DCArtboard id="dungeons" label="02 · Donjons" width={360} height={640}>
                <Phone><ScrDungeons /></Phone>
              </DCArtboard>

              <DCArtboard id="gouffre" label="03 · Gouffre" width={360} height={640}>
                <Phone><ScrGouffre /></Phone>
              </DCArtboard>

              <DCArtboard id="combat" label="04 · Combat · 5×8" width={360} height={640}>
                <Phone><ScrCombat cols={5} rows={8} tileSize={44} /></Phone>
              </DCArtboard>

              <DCArtboard id="combat-4x7" label="04b · Combat · 4×7 (plus lâche)" width={360} height={640}>
                <Phone><ScrCombat cols={4} rows={7} tileSize={54} /></Phone>
              </DCArtboard>

              <DCArtboard id="combat-6x9" label="04c · Combat · 6×9 (plus tactique)" width={360} height={640}>
                <Phone><ScrCombat cols={6} rows={9} tileSize={36} /></Phone>
              </DCArtboard>

              <DCArtboard id="market" label="05 · Marché" width={360} height={640}>
                <Phone><ScrMarche /></Phone>
              </DCArtboard>

              <DCArtboard id="guild" label="06 · Guilde" width={360} height={640}>
                <Phone><ScrGuilde /></Phone>
              </DCArtboard>

              <DCArtboard id="heroes" label="07 · Équipe" width={360} height={640}>
                <Phone><ScrHeroes /></Phone>
              </DCArtboard>

              <DCArtboard id="heroDetail" label="08 · Détail Héros" width={360} height={640}>
                <Phone><ScrHeroDetail /></Phone>
              </DCArtboard>

              <DCArtboard id="missions" label="09 · Missions" width={360} height={640}>
                <Phone><ScrMissions /></Phone>
              </DCArtboard>
            </DCSection>

            {/* ============================================
                SECTION 2 · SYSTÈME & COMPOSANTS
                ============================================ */}
            <DCSection id="tokens"
              title="Tokens · Palette principale"
              subtitle="Couleurs définies dans css/variables.css. Les autres ambiances rebindent les mêmes tokens."
            >
              <DCArtboard id="palette" label="Palette" width={720} height={260}>
                <PaletteSwatches />
              </DCArtboard>
            </DCSection>

            <DCSection id="components"
              title="Composants"
              subtitle="Boutons, monnaies, raretés, tags, barres, séparateurs runiques."
            >
              <DCArtboard id="components-card" label="Composants UI" width={720} height={520}>
                <ComponentsShowcase />
              </DCArtboard>
            </DCSection>

            <DCSection id="icons"
              title="Iconographie runique"
              subtitle="33 glyphes SVG monolinéaires, taille fluide via font-size · stroke = currentColor."
            >
              <DCArtboard id="icons-card" label="Glyphes" width={720} height={420}>
                <IconsShowcase />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
