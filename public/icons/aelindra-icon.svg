<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#1a0e1f"/>
      <stop offset="55%" stop-color="#0d0a18"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#f5e070"/>
      <stop offset="45%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8a6008"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" fill="url(#bg)" rx="0"/>

  <!-- ornements decoratifs -->
  <line x1="60" y1="100" x2="200" y2="100" stroke="#c8a84b" stroke-width="2" opacity="0.4"/>
  <line x1="312" y1="100" x2="452" y2="100" stroke="#c8a84b" stroke-width="2" opacity="0.4"/>
  <polygon points="256,30 270,70 256,55 242,70" fill="#c8a84b" opacity="0.7"/>

  <!-- A en Cinzel-like (gros lettre custom) -->
  <text x="256" y="400" text-anchor="middle"
        font-family="Cinzel Decorative, Cinzel, Georgia, serif"
        font-size="380" font-weight="900"
        fill="url(#gold)" filter="url(#glow)">A</text>

  <!-- ornements bas -->
  <line x1="60" y1="430" x2="200" y2="430" stroke="#c8a84b" stroke-width="2" opacity="0.4"/>
  <line x1="312" y1="430" x2="452" y2="430" stroke="#c8a84b" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="430" r="5" fill="#c8a84b" opacity="0.6"/>
</svg>
