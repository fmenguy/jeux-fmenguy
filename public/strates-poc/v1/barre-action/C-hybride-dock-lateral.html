<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>POC C - Hybride dock lateral</title>
<!--
================================================================================
POC C - Hybride : dock vertical droit + barre centrale compacte
================================================================================

Layout :
  Naviguer + Annuler + Demolir empiles dans un rail vertical, ancre au bord
  droit, centre vertical de l'ecran. La barre centrale au bord bas reste,
  mais compactee : juste les tabs Recoltes/Construire et leurs outils.

  +--------------------------------------------------------+ +-+
  |                                                        | |✥|  Naviguer
  |                                                        | +-+
  |                                                        | |↶|  Annuler
  |              [Recoltes][Construire]                    | +-+
  |              [bois][pierre][baies][...]                | |⛏|  Demolir
  +--------------------------------------------------------+ +-+

Forces :
  + Annuler / Demolir physiquement separes des outils contextuels : impossible
    de confondre "outil de l'onglet" et "action systeme".
  + Naviguer dans le rail = sortie de selection au pouce droit (joueur souris
    droitier), tres lisible comme "retour neutre".
  + Le rail vertical libere du pixel horizontal en bas : la barre centrale
    redescend a une largeur minimale (intrinseque au contenu), n'occupe que
    le strict necessaire.
  + Coherent avec d'autres rails vus dans des god-games modernes (Timberborn
    bookmark column) sans recreer leur UI.

Faiblesses :
  - Naviguer dans le rail droit casse une habitude RTS classique (Naviguer
    s'attend plutot en bas-gauche ou en haut). Onboarding necessaire.
  - Verticalite du rail = trois cibles alignees ; risque de mis-clic
    Demolir au lieu de Annuler. Compense ici par couleur danger + confirmation
    "armed" avant d'agir.
  - Si on ajoute plus tard d'autres actions systeme (Save, Settings, Pause),
    le rail s'allonge et perd son centrage. Prevoir un sub-grouping.
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#1b1914;--panel:#221e18;--panel-2:#2b261e;--panel-3:#362f25;
    --rule:#3d352a;--ink:#ede3cc;--ink-2:#b9ad91;--ink-3:#7f7562;
    --gold:#d4b870;--gold-2:#a88d4a;--grass:#7cc06a;--wood:#c48a52;
    --danger:#c87456;
    --serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
    --sans:"Inter",ui-sans-serif,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0e0d0a;color:var(--ink);font-family:var(--sans);font-size:13.5px;overflow:hidden}

  .stage{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 30% 20%,#2c3322 0%,transparent 55%),
      radial-gradient(ellipse at 70% 70%,#1a2417 0%,transparent 60%),
      linear-gradient(180deg,#1d2418 0%,#11140d 100%);
  }
  .stage::after{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(var(--rule) 1px,transparent 1px),
      linear-gradient(90deg,var(--rule) 1px,transparent 1px);
    background-size:60px 60px;opacity:.05;
    transform:perspective(800px) rotateX(60deg) translateY(40px) scale(2);
    transform-origin:center bottom;
  }
  .scene-label{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-3);background:rgba(27,25,20,.6);
    padding:5px 12px;border:1px solid var(--rule);border-radius:2px;
    backdrop-filter:blur(6px);z-index:30;
  }
  .label-id{color:var(--gold);margin-right:8px}

  /* ============================================================
     POC C - Rail vertical droit (Naviguer/Annuler/Demolir)
     + Barre centrale compacte (Tabs + outils)
     ============================================================ */

  /* ---- Rail vertical droit ---- */
  .actionbar-rail{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:8px;
    padding:10px 8px;
    background:linear-gradient(180deg,rgba(43,38,30,.96),rgba(34,30,24,.96));
    border:1px solid var(--rule);border-radius:6px;
    box-shadow:0 12px 32px rgba(0,0,0,.55), 0 1px 0 rgba(212,184,112,.08) inset;
    backdrop-filter:blur(8px);
    z-index:21;
  }
  .actionbar-rail::before{
    content:"systeme";
    position:absolute;left:-58px;top:50%;transform:translateY(-50%) rotate(-90deg);
    font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-3);opacity:.5;white-space:nowrap;
  }

  .rail-divider{
    height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent);
    margin:2px 4px;
  }

  /* ---- Barre centrale compacte ---- */
  #actionbar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    z-index:20;
  }
  .ab-tabs{
    display:flex;gap:4px;padding:4px;
    background:linear-gradient(180deg,rgba(43,38,30,.96),rgba(34,30,24,.96));
    border:1px solid var(--rule);border-radius:4px;
    backdrop-filter:blur(8px);
  }
  .ab-tab{
    appearance:none;background:transparent;border:none;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);
    padding:6px 14px;border-radius:3px;cursor:pointer;
    transition:color .12s,background .12s;
  }
  .ab-tab:hover{color:var(--ink-2);background:rgba(212,184,112,.06)}
  .ab-tab.active{color:#1a1510;background:var(--gold);font-weight:700}

  .ab-tools{
    display:flex;gap:6px;padding:8px;
    background:linear-gradient(180deg,rgba(43,38,30,.96),rgba(34,30,24,.96));
    border:1px solid var(--rule);border-radius:6px;
    box-shadow:0 12px 32px rgba(0,0,0,.55), 0 1px 0 rgba(212,184,112,.08) inset;
    backdrop-filter:blur(8px);
  }
  .ab-tools[hidden]{display:none}

  /* ---- Outils contextuels (centre) ---- */
  .tool{
    width:60px;height:60px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--rule);border-radius:4px;
    color:var(--ink-2);cursor:pointer;
    transition:border-color .12s,color .12s,transform .12s;
    position:relative;
  }
  .tool:hover{border-color:var(--gold-2);color:var(--ink);transform:translateY(-1px)}
  .tool.active{
    border-color:var(--gold);color:var(--gold);
    background:linear-gradient(180deg,#2e281e,#241f18);
    box-shadow:0 0 0 1px var(--gold) inset, 0 0 16px rgba(212,184,112,.18);
  }
  .tool .ic{font-size:21px;line-height:1}
  .tool .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  .tool .key{position:absolute;top:3px;right:4px;font-family:var(--mono);font-size:8px;color:var(--ink-3);opacity:.7}

  /* ---- Boutons rail (Naviguer + Annuler + Demolir, format identique) ---- */
  .rail-btn, .ab-act{
    width:54px;height:54px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--rule);border-radius:4px;
    color:var(--ink-2);cursor:pointer;
    transition:all .12s;
    position:relative;
  }
  .rail-btn .ic, .ab-act .ic{font-size:20px;line-height:1}
  .rail-btn .lab, .ab-act .lab{
    font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;
  }
  .rail-btn .key, .ab-act .key{
    position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:var(--ink-3);
    white-space:nowrap;
  }

  /* Naviguer (haut du rail) */
  .rail-navigate.active{
    border-color:var(--gold);color:var(--gold);
    background:linear-gradient(180deg,#2e281e,#241f18);
    box-shadow:0 0 0 1px var(--gold) inset, 0 0 14px rgba(212,184,112,.15);
  }
  .rail-navigate:hover{border-color:var(--gold-2);color:var(--ink)}

  /* Annuler */
  .ab-cancel:hover{border-color:var(--ink-2);color:var(--ink)}

  /* Demolir */
  .ab-destroy{color:#d49a82}
  .ab-destroy:hover{
    border-color:var(--danger);color:#fff;
    background:linear-gradient(180deg,#3a1c14,#26120c);
  }
  .ab-destroy.armed{
    border-color:var(--danger);color:#fff;
    background:linear-gradient(180deg,#5a261a,#3a1810);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(200,116,86,.5)}
    50%{box-shadow:0 0 0 6px rgba(200,116,86,0)}
  }

  /* Tooltip a la passe (rail) */
  .rail-btn::after, .ab-act::after{
    content:attr(data-tip);
    position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(-4px);
    background:rgba(15,13,9,.96);color:var(--ink);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 9px;border:1px solid var(--rule);border-radius:3px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;
  }
  .rail-btn:hover::after, .ab-act:hover::after{
    opacity:1;transform:translateY(-50%) translateX(0);
  }
</style>
</head>
<body>
  <div class="stage"></div>
  <div class="scene-label"><span class="label-id">POC C</span>Hybride : rail vertical droit + barre centrale compacte</div>

  <!-- Rail vertical droit : Naviguer + Annuler + Demolir -->
  <div class="actionbar-rail">
    <button class="rail-btn rail-navigate active" data-tool="navigate" data-tip="Naviguer (Esc)">
      <span class="ic">✥</span><span class="lab">Naviguer</span>
      <span class="key">ESC</span>
    </button>
    <div class="rail-divider"></div>
    <button class="ab-act ab-cancel" id="ab-cancel" data-tip="Annuler la derniere action">
      <span class="ic">↶</span><span class="lab">Annuler</span>
      <span class="key">CTRL Z</span>
    </button>
    <button class="ab-act ab-destroy" id="ab-destroy" data-tip="Demolir un batiment">
      <span class="ic">⛏</span><span class="lab">Demolir</span>
      <span class="key">DEL</span>
    </button>
  </div>

  <!-- Barre centrale : tabs + outils contextuels -->
  <div id="actionbar">
    <div class="ab-tabs" role="tablist">
      <button class="ab-tab active" data-tab="recoltes">Recoltes</button>
      <button class="ab-tab" data-tab="construire">Construire</button>
    </div>

    <div class="ab-tools" data-pane="recoltes">
      <button class="tool" data-tool="bois"><span class="ic">🪓</span><span class="lab">Bois</span><span class="key">1</span></button>
      <button class="tool" data-tool="pierre"><span class="ic">⛏</span><span class="lab">Pierre</span><span class="key">2</span></button>
      <button class="tool" data-tool="baies"><span class="ic">🌿</span><span class="lab">Baies</span><span class="key">3</span></button>
      <button class="tool" data-tool="chasse"><span class="ic">🏹</span><span class="lab">Chasse</span><span class="key">4</span></button>
    </div>
    <div class="ab-tools" data-pane="construire" hidden>
      <button class="tool" data-tool="hutte"><span class="ic">🏠</span><span class="lab">Hutte</span><span class="key">1</span></button>
      <button class="tool" data-tool="atelier"><span class="ic">🔨</span><span class="lab">Atelier</span><span class="key">2</span></button>
      <button class="tool" data-tool="entrepot"><span class="ic">📦</span><span class="lab">Entrepot</span><span class="key">3</span></button>
      <button class="tool" data-tool="route"><span class="ic">═</span><span class="lab">Route</span><span class="key">4</span></button>
      <button class="tool" data-tool="palissade"><span class="ic">▦</span><span class="lab">Palissade</span><span class="key">5</span></button>
    </div>
  </div>

<script>
  // ----- Tabs -----
  const tabs = document.querySelectorAll(".ab-tab");
  const panes = document.querySelectorAll(".ab-tools");
  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    const k = t.dataset.tab;
    panes.forEach(p => p.hidden = (p.dataset.pane !== k));
    cancelAllSelections();
  }));

  // ----- Tool selection (centre) -----
  document.addEventListener("click", e => {
    const t = e.target.closest(".tool");
    if (!t) return;
    document.querySelectorAll(".tool").forEach(x => x.classList.remove("active"));
    document.querySelector(".rail-navigate").classList.remove("active");
    t.classList.add("active");
    document.getElementById("ab-destroy").classList.remove("armed");
  });

  // ----- Naviguer (rail) : revient a l'etat neutre -----
  document.querySelector(".rail-navigate").addEventListener("click", e => {
    e.stopPropagation();
    cancelAllSelections();
  });

  // ----- Cancel -----
  document.getElementById("ab-cancel").addEventListener("click", cancelAllSelections);
  function cancelAllSelections(){
    document.querySelectorAll(".tool").forEach(x => x.classList.remove("active"));
    document.querySelector(".rail-navigate").classList.add("active");
    document.getElementById("ab-destroy").classList.remove("armed");
  }

  // ----- Demolir -----
  document.getElementById("ab-destroy").addEventListener("click", e => {
    e.stopPropagation();
    const b = e.currentTarget;
    document.querySelectorAll(".tool").forEach(x => x.classList.remove("active"));
    document.querySelector(".rail-navigate").classList.remove("active");
    b.classList.toggle("armed");
  });

  // ----- Keyboard shortcuts -----
  window.addEventListener("keydown", e => {
    if (e.key === "Escape") cancelAllSelections();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      e.preventDefault();
      document.getElementById("ab-cancel").click();
    }
    if (e.key === "Delete") document.getElementById("ab-destroy").click();
  });
</script>
</body>
</html>
