<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achrogemme · design</title>

<!-- Polices : Cinzel (titres) + Inter (corps), comme dans le projet Astro -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<!-- Feuille de style unique (à fusionner dans stratageme.css) -->
<link rel="stylesheet" href="styles/achrogemme.css">

<style>
  html, body, #root {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: oklch(0.18 0.022 55);
    font-family: "Inter", system-ui, sans-serif;
  }
  /* Réduction de l'effet légendaire si Tweak "minimal" */
  .ach-no-legendary-fx .ach-card[data-rarity="legendaire"] .ach-card__halo { display: none; }
  .ach-no-legendary-fx .ach-card[data-rarity="legendaire"] .ach-card__entrelac { opacity: 0.4; filter: none; }
  .ach-no-legendary-fx .ach-card[data-rarity="legendaire"][data-saga="tome2"] .ach-card__crystal-marker { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Composants utilitaires -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- Composants Achrogemme (ordre : icons -> data -> Card -> Champion -> SynergyBar -> Board -> CombatPhases -> Intro -> App) -->
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/data.jsx"></script>
<script type="text/babel" src="components/Card.jsx"></script>
<script type="text/babel" src="components/Champion.jsx"></script>
<script type="text/babel" src="components/SynergyBar.jsx"></script>
<script type="text/babel" src="components/Board.jsx"></script>
<script type="text/babel" src="components/CombatPhases.jsx"></script>
<script type="text/babel" src="components/IntroScreen.jsx"></script>

<script type="text/babel" src="app.jsx"></script>
</body>
</html>
